<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RSVP - Smartevent</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --gold: #d4af37;
      --gold-hover: #b89628;
      --text-white: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-white);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 30px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header h1 {
      color: var(--gold);
      font-size: 24px;
      letter-spacing: 1px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .header p {
      color: var(--text-muted);
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 500;
    }

    input, select {
      width: 100%;
      padding: 12px 14px;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-white);
      font-size: 14px;
      outline: none;
      transition: border-color 0.3s;
    }

    input:focus, select:focus {
      border-color: var(--gold);
    }

    .hidden {
      display: none;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background-color: var(--gold);
      color: #000;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.3s;
    }

    .btn-submit:hover {
      background-color: var(--gold-hover);
    }

    .status-msg {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
    }

    .success { color: #4ade80; }
    .error { color: #f87171; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Confirmation RSVP</h1>
      <p>Veuillez remplir ce formulaire pour valider votre présence</p>
    </div>

    <form id="rsvpForm">
      
      <!-- Nom complet -->
      <div class="form-group">
        <label for="nom">Nom Complet *</label>
        <input type="text" id="nom" placeholder="Ex: Jean Kabangu" required>
      </div>

      <!-- Téléphone -->
      <div class="form-group">
        <label for="telephone">Numéro WhatsApp / Téléphone *</label>
        <input type="tel" id="telephone" placeholder="Ex: +243..." required>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label for="email">Adresse Email</label>
        <input type="email" id="email" placeholder="Ex: exemple@mail.com">
      </div>

      <!-- Présence -->
      <div class="form-group">
        <label for="presence">Serez-vous présent(e) ? *</label>
        <select id="presence" required>
          <option value="Oui">Oui, je serai présent(e)</option>
          <option value="Non">Non, je ne pourrai pas</option>
        </select>
      </div>

      <!-- Affiliation -->
      <div class="form-group">
        <label for="affiliation">Vous êtes du côté de : *</label>
        <select id="affiliation" required>
          <option value="Famille du marié">Famille du Marié</option>
          <option value="Famille de la mariée">Famille de la Mariée</option>
          <option value="Amis">Amis / Invités</option>
        </select>
      </div>

      <!-- Boisson -->
      <div class="form-group">
        <label for="boisson">Préférence de Boisson *</label>
        <select id="boisson" required>
          <option value="Sucré / Jus">Sucré / Jus</option>
          <option value="Bière">Bière</option>
          <option value="Vin / Champagne">Vin / Champagne</option>
          <option value="Eau Minérale">Eau Minérale</option>
        </select>
      </div>

      <!-- Option Accompagnant -->
      <div class="form-group">
        <label for="avec_accompagnant">Venez-vous accompagné(e) ? *</label>
        <select id="avec_accompagnant" onchange="toggleAccompagnant(this.value)" required>
          <option value="non">Non, je viens seul(e)</option>
          <option value="oui">Oui, je viens avec un(e) accompagnant(e)</option>
        </select>
      </div>

      <!-- Champ dynamique Nom Accompagnant -->
      <div class="form-group hidden" id="champ_accompagnant">
        <label for="nom_accompagnant">Nom complet de l'accompagnant(e) *</label>
        <input type="text" id="nom_accompagnant" placeholder="Ex: Marie Kabangu">
      </div>

      <button type="submit" class="btn-submit" id="btnSubmit">Confirmer ma présence</button>

      <div id="statusMsg" class="status-msg"></div>

    </form>
  </div>

  <script>
    // Affiche ou masque le champ de l'accompagnant
    function toggleAccompagnant(valeur) {
      const champAccompagnant = document.getElementById("champ_accompagnant");
      const inputNomAccompagnant = document.getElementById("nom_accompagnant");

      if (valeur === "oui") {
        champAccompagnant.classList.remove("hidden");
        inputNomAccompagnant.setAttribute("required", "required");
      } else {
        champAccompagnant.classList.add("hidden");
        inputNomAccompagnant.removeAttribute("required");
        inputNomAccompagnant.value = "";
      }
    }

    // Gestion de la soumission du formulaire
    document.getElementById("rsvpForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const btn = document.getElementById("btnSubmit");
      const statusMsg = document.getElementById("statusMsg");

      btn.disabled = true;
      btn.innerText = "Envoi en cours...";
      statusMsg.innerText = "";
      statusMsg.className = "status-msg";

      // Génération automatique d'un Ticket ID unique
      const ticketId = "TICK-" + Math.floor(100000 + Math.random() * 900000);

      const avecAccompagnant = document.getElementById("avec_accompagnant").value;

      // Construction des données envoyées à n8n
      const payload = {
        ticket_id: ticketId,
        nom_complet: document.getElementById("nom").value,
        telephone: document.getElementById("telephone").value,
        email: document.getElementById("email").value,
        presence: document.getElementById("presence").value,
        affiliation: document.getElementById("affiliation").value,
        boisson: document.getElementById("boisson").value,
        avec_accompagnant: avecAccompagnant,
        nom_accompagnant: avecAccompagnant === "oui" ? document.getElementById("nom_accompagnant").value : "",
        date_soumission: new Date().toISOString()
      };

      try {
        const response = await fetch("https://n8n-rirk.srv1828754.hstgr.cloud/webhook-test/6c9b0d4e-1af4-4efa-8c69-1c8dd7f6f94b", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          statusMsg.innerText = "✅ Confirmation enregistrée avec succès !";
          statusMsg.classList.add("success");
          document.getElementById("rsvpForm").reset();
          toggleAccompagnant("non");
        } else {
          throw new Error("Erreur serveur lors de l'envoi");
        }
      } catch (error) {
        statusMsg.innerText = "❌ Une erreur s'est produite. Veuillez réessayer.";
        statusMsg.classList.add("error");
      } finally {
        btn.disabled = false;
        btn.innerText = "Confirmer ma présence";
      }
    });
  </script>

</body>
</html>
