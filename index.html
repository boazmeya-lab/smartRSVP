<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RSVP - Smartevent</title>
  
  <!-- Librairie QR Code -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      /* Palette de couleurs */
      --bg-sable: #F5EFEB;       /* Beige sable */
      --text-marron: #3D2B1F;    /* Marron foncé */
      --terracotta: #C85A32;     /* Terracotta */
      --terracotta-hover: #A84622;
      --or: #D4AF37;             /* Touche d'or */
      --card-bg: #FAF6F0;        /* Crème clair */
      --border-color: #E2D7CD;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Georgia, serif;
      background-color: var(--bg-sable);
      /* Motif abstrait géométrique subtil en arrière-plan */
      background-image: radial-gradient(var(--or) 0.5px, transparent 0.5px), radial-gradient(var(--terracotta) 0.5px, var(--bg-sable) 0.5px);
      background-size: 20px 20px;
      background-position: 0 0, 10px 10px;
      opacity: 0.98;
      color: var(--text-marron);
      margin: 0;
      padding: 20px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background: var(--card-bg);
      width: 100%;
      max-width: 460px;
      padding: 32px 24px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      box-shadow: 0 12px 30px rgba(61, 43, 31, 0.08);
      position: relative;
      overflow: hidden;
    }

    /* Bordure décorative dorée supérieure */
    .container::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(90deg, var(--terracotta), var(--or), var(--terracotta));
    }

    .header { text-align: center; margin-bottom: 28px; }
    
    /* Titre avec serif élégant */
    .header h1 { 
      margin: 10px 0 8px 0; 
      font-family: Georgia, serif; 
      font-size: 1.7rem; 
      color: var(--text-marron); 
    }
    
    .header p { margin: 0; color: #6E5341; font-size: 0.95rem; }

    /* Motif décoratif sous le titre */
    .divider-pattern {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      color: var(--or);
      font-size: 0.8rem;
      margin-top: 6px;
    }

    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 8px; color: var(--text-marron); }
    
    input[type="text"], input[type="tel"], input[type="email"], select {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border-color);
      background-color: #FFFFFF;
      border-radius: 10px;
      font-size: 1rem;
      color: var(--text-marron);
      transition: all 0.2s;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--terracotta);
      box-shadow: 0 0 0 3px rgba(200, 90, 50, 0.15);
    }

    .radio-group { display: flex; gap: 12px; }
    .radio-option {
      flex: 1;
      border: 1px solid var(--border-color);
      background: #FFFFFF;
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }
    .radio-option input { display: none; }
    .radio-option.active {
      border-color: var(--terracotta);
      background-color: #FDF2EE;
      color: var(--terracotta);
      font-weight: 700;
    }

    button.btn-submit {
      width: 100%;
      background: linear-gradient(135deg, var(--terracotta), var(--terracotta-hover));
      color: #FFFFFF;
      border: none;
      padding: 16px;
      border-radius: 10px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 12px rgba(200, 90, 50, 0.25);
      transition: transform 0.1s, background 0.2s;
    }
    button.btn-submit:hover { 
      background: var(--terracotta-hover); 
      transform: translateY(-1px);
    }

    /* Carte d'accès Pass QR Code */
    #pass-container {
      display: none;
      text-align: center;
      animation: fadeIn 0.4s ease-in-out;
    }

    .pass-card {
      background: #FFFFFF;
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 24px 16px;
      margin-top: 20px;
      position: relative;
    }

    .pass-card::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 10%;
      right: 10%;
      height: 3px;
      background: var(--or);
      border-radius: 2px;
    }

    #qrcode {
      display: flex;
      justify-content: center;
      margin: 20px 0;
    }
    
    #qrcode img {
      border-radius: 10px;
      padding: 10px;
      background: #FFFFFF;
      border: 2px solid var(--border-color);
    }

    .ticket-id {
      font-family: monospace;
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--terracotta);
      letter-spacing: 1.5px;
      margin-top: 6px;
    }

    .notice {
      font-size: 0.85rem;
      color: #6E5341;
      margin-top: 14px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="container">

  <!-- FORMULAIRE RSVP -->
  <div id="rsvp-section">
    <div class="header">
      <h1>Confirmation de Présence</h1>
      <div class="divider-pattern">❖ ✦ ❖</div>
      <p style="margin-top: 8px;">Veuillez remplir vos détails pour valider votre invitation.</p>
    </div>

    <form id="rsvp-form" onsubmit="soumettreRSVP(event)">
      <div class="form-group">
        <label>Serez-vous présent(e) ?</label>
        <div class="radio-group">
          <label class="radio-option active" id="label-oui">
            <input type="radio" name="presence" value="true" checked onclick="togglePresence(true)"> Oui 🎉
          </label>
          <label class="radio-option" id="label-non">
            <input type="radio" name="presence" value="false" onclick="togglePresence(false)"> Non ❌
          </label>
        </div>
      </div>

      <div class="form-group">
        <label for="nom">Nom complet</label>
        <input type="text" id="nom" required placeholder="ex: Jean Dupont">
      </div>

      <div class="form-group">
        <label for="telephone">Numéro WhatsApp / Téléphone</label>
        <input type="tel" id="telephone" required placeholder="ex: +243 810 000 000">
      </div>

      <div class="form-group">
        <label for="email">Adresse e-mail</label>
        <input type="email" id="email" required placeholder="ex: jean@gmail.com">
      </div>

      <!-- Options affichées uniquement si présent -->
      <div id="options-presence">
        <div class="form-group">
          <label for="affiliation">Vous êtes de la part de :</label>
          <select id="affiliation">
            <option value="Famille du marié">Famille du marié</option>
            <option value="Famille de la mariée">Famille de la mariée</option>
            <option value="Ami(e)">Ami(e)</option>
            <option value="Autre">Autre</option>
          </select>
        </div>

        <div class="form-group">
          <label for="boisson">Choix de la boisson :</label>
          <select id="boisson">
            <option value="Fanta">Fanta</option>
            <option value="Coca-Cola">Coca-Cola</option>
            <option value="Pepsi">Pepsi</option>
            <option value="Eau / Jus">Eau / Jus</option>
          </select>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="btn-submit">Valider ma réponse</button>
    </form>
  </div>

  <!-- PASS D'ACCÈS AVEC QR CODE -->
  <div id="pass-container">
    <div class="header">
      <h1 id="pass-title" style="font-family: Georgia, serif;">Votre Pass d'Accès</h1>
      <div class="divider-pattern">❖ ✦ ❖</div>
      <p id="pass-subtitle" style="margin-top: 8px;">Présentez ce QR Code à l'entrée de l'événement.</p>
    </div>

    <div class="pass-card">
      <div id="guest-name" style="font-weight: bold; font-size: 1.25rem; color: var(--text-marron);"></div>
      <div class="ticket-id" id="ticket-id-display"></div>
      
      <!-- Zone QR Code (Contient uniquement le code ticketID pour SmartCheck) -->
      <div id="qrcode"></div>

      <p class="notice">💡 <strong>Conseil :</strong> Prenez une capture d'écran de ce pass pour l'avoir avec vous le jour J.</p>
    </div>
  </div>

</div>

<script>
  // URL de ton Webhook n8n
  const N8N_WEBHOOK_URL = "https://n8n-rirk.srv1828754.hstgr.cloud/webhook-test/6c9b0d4e-1af4-4efa-8c69-1c8dd7f6f94b";

  function togglePresence(estPresent) {
    const optionsDiv = document.getElementById("options-presence");
    const labelOui = document.getElementById("label-oui");
    const labelNon = document.getElementById("label-non");

    if (estPresent) {
      optionsDiv.style.display = "block";
      labelOui.classList.add("active");
      labelNon.classList.remove("active");
    } else {
      optionsDiv.style.display = "none";
      labelOui.classList.remove("active");
      labelNon.classList.add("active");
    }
  }

  async function soumettreRSVP(event) {
    event.preventDefault();

    const btnSubmit = document.getElementById("btn-submit");
    btnSubmit.disabled = true;
    btnSubmit.textContent = "Validation en cours...";

    const isPresent = document.querySelector('input[name="presence"]:checked').value === "true";
    const nomComplet = document.getElementById("nom").value.trim();
    const telephone = document.getElementById("telephone").value.trim();
    const email = document.getElementById("email").value.trim();
    const affiliation = isPresent ? document.getElementById("affiliation").value : "N/A";
    const boisson = isPresent ? document.getElementById("boisson").value : "N/A";

    // Génération de l'ID unique du ticket
    const ticketID = "SMART-" + Math.random().toString(36).substring(2, 6).toUpperCase() + Date.now().toString().slice(-4);

    const payload = {
      ticket_id: ticketID,
      nom_complet: nomComplet,
      telephone: telephone,
      email: email,
      presence: isPresent,
      affiliation: affiliation,
      boisson: boisson,
      date_soumission: new Date().toISOString()
    };

    try {
      fetch(N8N_WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      document.getElementById("rsvp-section").style.display = "none";
      const passContainer = document.getElementById("pass-container");
      passContainer.style.display = "block";

      if (isPresent) {
        document.getElementById("guest-name").textContent = nomComplet;
        document.getElementById("ticket-id-display").textContent = ticketID;

        // Génération du QR Code brut (ticketID) parfait pour SmartCheck
        new QRCode(document.getElementById("qrcode"), {
          text: ticketID,
          width: 180,
          height: 180,
          colorDark : "#3D2B1F",
          colorLight : "#FFFFFF",
          correctLevel : QRCode.CorrectLevel.H
        });
      } else {
        document.getElementById("pass-title").textContent = "Merci pour votre réponse";
        document.getElementById("pass-subtitle").textContent = "Nous avons bien enregistré votre absence.";
        document.querySelector(".pass-card").innerHTML = `<p style="color: var(--text-marron);">Nous sommes désolés que vous ne puissiez pas être des nôtres, <strong>${nomComplet}</strong>.</p>`;
      }

    } catch (error) {
      console.error("Erreur :", error);
      alert("Une erreur est survenue. Veuillez réessayer.");
      btnSubmit.disabled = false;
      btnSubmit.textContent = "Valider ma réponse";
    }
  }
</script>

</body>
</html>
