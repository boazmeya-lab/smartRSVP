<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RSVP - Smartevent</title>
  <style>
    :root {
      --bg-card: #ffffff;
      --navy-accent: #1F3A5F;
      --navy-hover: #142742;
      --gold-accent: #D4AF37;
      --gold-hover: #b89628;
      --text-main: #222222;
      --text-muted: #666666;
      --border-color: #e0e0e0;
      --input-bg: #f9f9f9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      /* Photo de mariage en arrière-plan avec voile sombre pour faire ressortir la carte */
      background: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)), 
                  url('https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat fixed;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card-container {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      width: 100%;
      max-width: 680px;
      display: flex;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
    }

    /* Bande Motif Afro */
    .afro-sidebar {
      width: 110px;
      background-color: #1a1a1a;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border-right: 2px solid var(--gold-accent);
    }

    .pattern-strip {
      width: 100%;
      height: 100%;
      background-size: 50px 50px;
      background-image: 
        linear-gradient(135deg, var(--gold-accent) 25%, transparent 25%),
        linear-gradient(225deg, var(--gold-accent) 25%, transparent 25%),
        linear-gradient(45deg, var(--gold-accent) 25%, transparent 25%),
        linear-gradient(315deg, var(--gold-accent) 25%, transparent 25%);
      background-position: 25px 0, 25px 0, 0 0, 0 0;
      opacity: 0.85;
    }

    .form-content {
      padding: 30px;
      flex-grow: 1;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header h1 {
      color: var(--navy-accent);
      font-size: 22px;
      letter-spacing: 1.5px;
      margin-bottom: 6px;
      text-transform: uppercase;
      font-weight: 700;
    }

    .header p {
      color: var(--text-muted);
      font-size: 13px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input, select {
      width: 100%;
      padding: 11px 13px;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    input:focus, select:focus {
      border-color: var(--gold-accent);
      box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.2);
    }

    .hidden {
      display: none !important;
    }

    .btn-submit {
      width: 100%;
      padding: 13px;
      background-color: var(--navy-accent);
      color: #ffffff;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: background-color 0.3s;
    }

    .btn-submit:hover {
      background-color: var(--navy-hover);
    }

    .status-msg {
      margin-top: 15px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
    }

    .success { color: #15803d; }
    .error { color: #b91c1c; }

    /* Carte du Pass QR Code */
    .pass-container {
      text-align: center;
      padding: 20px;
      background-color: #fcfbf7;
      border: 1px solid var(--gold-accent);
      border-radius: 12px;
      margin-top: 10px;
    }

    .pass-container h3 {
      color: var(--navy-accent);
      margin-bottom: 8px;
      font-size: 18px;
    }

    .pass-container p.subtitle {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 15px;
    }

    .qr-box {
      background: #ffffff;
      padding: 12px;
      display: inline-block;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      margin-bottom: 15px;
    }

    .qr-box img {
      width: 180px;
      height: 180px;
      display: block;
    }

    .pass-details {
      text-align: left;
      background-color: #ffffff;
      border: 1px solid var(--border-color);
      padding: 14px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.6;
    }

    .pass-details strong {
      color: var(--text-muted);
    }

    .pass-details span {
      color: var(--text-main);
    }

    @media (max-width: 550px) {
      .card-container {
        flex-direction: column;
      }
      .afro-sidebar {
        width: 100%;
        height: 40px;
        border-right: none;
        border-bottom: 2px solid var(--gold-accent);
      }
      .pattern-strip {
        background-size: 30px 30px;
      }
    }
  </style>
</head>
<body>

  <div class="card-container">
    
    <!-- Motif Afro latéral -->
    <div class="afro-sidebar">
      <div class="pattern-strip"></div>
    </div>

    <!-- Contenu -->
    <div class="form-content">
      
      <!-- ENTÊTE -->
      <div class="header">
        <h1>Confirmation RSVP</h1>
        <p>Veuillez valider votre présence ci-dessous</p>
      </div>

      <!-- FORMULAIRE RSVP -->
      <form id="rsvpForm">
        
        <!-- Nom complet -->
        <div class="form-group">
          <label for="nom">Nom Complet *</label>
          <input type="text" id="nom" placeholder="Ex: Jean Kabangu" required>
        </div>

        <!-- Téléphone -->
        <div class="form-group">
          <label for="telephone">Numéro WhatsApp / Téléphone *</label>
          <input type="tel" id="telephone" placeholder="Ex: +243..." required>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label for="email">Adresse Email</label>
          <input type="email" id="email" placeholder="Ex: exemple@mail.com">
        </div>

        <!-- PRÉSENCE -->
        <div class="form-group">
          <label for="presence">Serez-vous présent(e) ? *</label>
          <select id="presence" onchange="togglePresenceFields(this.value)" required>
            <option value="Oui">Oui, je serai présent(e)</option>
            <option value="Non">Non, je ne pourrai pas</option>
          </select>
        </div>

        <!-- SECTION OPTIONS (Champs masqués si Absent) -->
        <div id="options_presence">
          
          <!-- Affiliation -->
          <div class="form-group">
            <label for="affiliation">Vous êtes du côté de : *</label>
            <select id="affiliation">
              <option value="Famille du marié">Famille du Marié</option>
              <option value="Famille de la mariée">Famille de la Mariée</option>
              <option value="Amis">Amis / Invités</option>
            </select>
          </div>

          <!-- Boisson -->
          <div class="form-group">
            <label for="boisson">Préférence de Boisson *</label>
            <select id="boisson">
              <option value="Sucré / Jus">Sucré / Jus</option>
              <option value="Bière">Bière</option>
              <option value="Vin / Champagne">Vin / Champagne</option>
              <option value="Eau Minérale">Eau Minérale</option>
            </select>
          </div>

          <!-- Option Accompagnant -->
          <div class="form-group">
            <label for="avec_accompagnant">Venez-vous accompagné(e) ? *</label>
            <select id="avec_accompagnant" onchange="toggleAccompagnant(this.value)">
              <option value="non">Non, je viens seul(e)</option>
              <option value="oui">Oui, je viens avec un(e) accompagnant(e)</option>
            </select>
          </div>

          <!-- Nom Accompagnant -->
          <div class="form-group hidden" id="champ_accompagnant">
            <label for="nom_accompagnant">Nom complet de l'accompagnant(e) *</label>
            <input type="text" id="nom_accompagnant" placeholder="Ex: Marie Kabangu">
          </div>

        </div>

        <button type="submit" class="btn-submit" id="btnSubmit">Confirmer</button>

        <div id="statusMsg" class="status-msg"></div>

      </form>

      <!-- AFFICHAGE DU PASS + QR CODE (Masqué au début) -->
      <div id="passSection" class="pass-container hidden">
        <h3>🎉 Pass d'accès validé !</h3>
        <p class="subtitle">Veuillez enregistrer ou capturer ce QR Code pour l'entrée.</p>

        <div class="qr-box">
          <img id="qrCodeImg" src="" alt="QR Code d'accès">
        </div>

        <div class="pass-details">
          <p><strong>Invité :</strong> <span id="passNom"></span></p>
          <p><strong>Table :</strong> <span id="passTable" style="color: var(--gold-accent); font-weight: bold;"></span></p>
          <p><strong>Code Ticket :</strong> <span id="passTicket"></span></p>
          <p id="passAccompagnantRow" class="hidden"><strong>Accompagnant :</strong> <span id="passAccompagnant"></span></p>
        </div>
      </div>

    </div>

  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const tableAttribuee = urlParams.get('table') || 'Non attribuée';

    function togglePresenceFields(valeur) {
      const optionsDiv = document.getElementById("options_presence");
      if (valeur.toLowerCase().includes("non")) {
        optionsDiv.classList.add("hidden");
      } else {
        optionsDiv.classList.remove("hidden");
      }
    }

    function toggleAccompagnant(valeur) {
      const champAccompagnant = document.getElementById("champ_accompagnant");
      const inputNomAccompagnant = document.getElementById("nom_accompagnant");

      if (valeur === "oui") {
        champAccompagnant.classList.remove("hidden");
        inputNomAccompagnant.setAttribute("required", "required");
      } else {
        champAccompagnant.classList.add("hidden");
        inputNomAccompagnant.removeAttribute("required");
        inputNomAccompagnant.value = "";
      }
    }

    document.getElementById("rsvpForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const btn = document.getElementById("btnSubmit");
      const statusMsg = document.getElementById("statusMsg");

      btn.disabled = true;
      btn.innerText = "Traitement en cours...";
      statusMsg.innerText = "";
      statusMsg.className = "status-msg";

      const presenceRaw = document.getElementById("presence").value;
      const estPresent = presenceRaw.toLowerCase().includes("oui") || presenceRaw.toLowerCase().includes("présent");
      const presenceFormatted = estPresent ? "Oui" : "Non";

      const avecAccompagnant = document.getElementById("avec_accompagnant").value;
      const nomComplet = document.getElementById("nom").value;
      const nomAccompagnant = document.getElementById("nom_accompagnant").value;

      const ticketId = estPresent ? ("TICK-" + Math.floor(100000 + Math.random() * 900000)) : "AUCUN";

      const payload = {
        ticket_id: ticketId,
        nom_complet: nomComplet,
        telephone: document.getElementById("telephone").value,
        email: document.getElementById("email").value,
        presence: presenceFormatted,
        affiliation: estPresent ? document.getElementById("affiliation").value : "N/A",
        boisson: estPresent ? document.getElementById("boisson").value : "N/A",
        avec_accompagnant: estPresent ? avecAccompagnant : "non",
        nom_accompagnant: (estPresent && avecAccompagnant === "oui") ? nomAccompagnant : "",
        table: estPresent ? tableAttribuee : "N/A",
        date_soumission: new Date().toISOString()
      };

      try {
        const response = await fetch("https://n8n-rirk.srv1828754.hstgr.cloud/webhook/6c9b0d4e-1af4-4efa-8c69-1c8dd7f6f94b", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          if (estPresent) {
            document.getElementById("rsvpForm").style.display = "none";

            document.getElementById("passNom").innerText = nomComplet;
            document.getElementById("passTable").innerText = tableAttribuee;
            document.getElementById("passTicket").innerText = ticketId;

            if (avecAccompagnant === "oui" && nomAccompagnant) {
              document.getElementById("passAccompagnant").innerText = nomAccompagnant;
              document.getElementById("passAccompagnantRow").classList.remove("hidden");
            }

            const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${ticketId}`;
            document.getElementById("qrCodeImg").src = qrUrl;

            document.getElementById("passSection").classList.remove("hidden");
          } else {
            statusMsg.innerText = "📩 Merci ! Votre réponse (Absent) a bien été enregistrée.";
            statusMsg.classList.add("success");
            document.getElementById("rsvpForm").reset();
            btn.disabled = false;
            btn.innerText = "Confirmer";
          }
        } else {
          throw new Error("Erreur serveur lors de l'envoi");
        }
      } catch (error) {
        statusMsg.innerText = "❌ Une erreur s'est produite. Veuillez réessayer.";
        statusMsg.classList.add("error");
        btn.disabled = false;
        btn.innerText = "Confirmer";
      }
    });
  </script>

</body>
</html>
